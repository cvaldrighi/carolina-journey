name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: API · build + testes unitários e E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: carol
          POSTGRES_PASSWORD: carol
          POSTGRES_DB: carolina_journey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carol -d carolina_journey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: carol
      DB_PASSWORD: carol
      DB_NAME: carolina_journey
      DB_SSL: "false"

    defaults:
      run:
        working-directory: graphql-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: graphql-api/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run seed
      - run: npm test
      - run: npm run test:e2e

  functions-build:
    name: Functions · build (${{ matrix.function }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [profile-summary, career-summary]

    defaults:
      run:
        working-directory: functions/${{ matrix.function }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/${{ matrix.function }}/package-lock.json

      - run: npm ci
      - run: npm run build

  docker-compose:
    name: Docker Compose · smoke test
    runs-on: ubuntu-latest
    needs: [api-tests, functions-build]

    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo
        run: docker compose up -d --build

      - name: Testar endpoints
        run: ./scripts/smoke-test.sh

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
